version: '3.8'

services:
  face-recognition-v2:
    build: .
    container_name: face-recognition-service-v2
    ports:
      - "5000:5000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=5000
      - FACE_MATCH_THRESHOLD=0.6
    volumes:
      - ./database:/app/database
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - face-recognition-network

networks:
  face-recognition-network:
    driver: bridge
